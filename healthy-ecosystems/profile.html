<body data-page="profile">
<div class="page">

<header class="site-header bordered">
  <a class="logo" href="index.html">
    <img src="assets/logo.svg" alt="">
    <span>Healthy<br>Ecosystems</span>
  </a>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="demo.html" class="active">Demo</a>

  </nav>

  <div class="header-actions">
    <a href="profile.html">Sign In</a>

  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <h2>Healthy Ecosystems</h2>
    <nav class="side-nav">
      <a href="demo.html"><img src="assets/nav-home.png" alt="">Home</a>
      <a href="search.html"><img src="assets/nav-search.png" alt="">Search</a>

  <main class="app-main">
    <h1 class="hello">Profile</h1>
    <section class="profile-card">

        <h2>John Doe</h2>

      <div><strong id="pf-health"></strong><span>Health Score</span></div>
    </section>
    <section class="item-list wide">
      <h3>Top Items</h3>
      <ul id="pf-top"></ul>
    </section>
    <section class="item-list wide">
      <h3>Recent Buys</h3>
      <ul id="pf-recent"></ul>
