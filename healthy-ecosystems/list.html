<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List | Healthy Ecosystems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Mulish:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>

<body data-page="list">
<div class="page">

<header class="site-header bordered">
  <a class="logo" href="index.html">
    <img src="assets/logo.svg" alt="">
    <span>Healthy<br>Ecosystems</span>
  </a>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="demo.html" class="active">Demo</a>
    <a href="about.html">About</a>
  </nav>

  <div class="header-actions">
    <a href="profile.html">Sign In</a>
    <a class="pill-button" href="demo.html">Get Started</a>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <h2>Healthy Ecosystems</h2>
    <nav class="side-nav">
      <a href="demo.html"><img src="assets/nav-home.png" alt="">Home</a>
      <a href="search.html"><img src="assets/nav-search.png" alt="">Search</a>
      <a href="scan.html"><img src="assets/nav-scan.png" alt="">Scan</a>
      <a href="list.html" class="active"><img src="assets/nav-list.png" alt="">List</a>
      <a href="profile.html"><img src="assets/nav-profile.png" alt="">Profile</a>
    </nav>
  </aside>

  <main class="app-main">
    <h1 class="hello">Your List</h1>
    <div class="list-totals">
      <div><span>Total</span><strong id="list-total"></strong></div>
      <div><span>Emissions</span><strong id="list-emissions"></strong></div>
      <div><span>Ecosystems Score</span><strong id="list-score"></strong></div>
    </div>
    <div class="list-table-wrap">
      <table class="list-table">
        <thead><tr><th>Product</th><th>Store</th><th>Price</th><th>Emissions</th><th>Score</th><th><span class="visually-hidden">Remove</span></th></tr></thead>
        <tbody id="list-rows"></tbody>
      </table>
    </div>
    <div class="list-actions">
      <a class="button" href="search.html">Add products</a>
      <button class="button-outline" id="reset-list" type="button">Load sample list</button>
      <button class="button-outline" id="clear-list" type="button">Clear list</button>
    </div>
    <p class="sample-note">Scores use sample data for this demo.</p>
  </main>
</div>

<p class="copyright">© 2026 Healthy Ecosystems</p>
</div>
<script src="data.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
